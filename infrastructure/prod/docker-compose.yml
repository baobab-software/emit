name: emit-prod
version: 0.0.1
services:
  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - emit

  redis:
    image: ${REDIS_IMAGE}
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${REDIS_PASSWORD}

    volumes:
      - redis_data:/data

    networks:
      - emit

networks:
  emit:
    name: emit_prod_network